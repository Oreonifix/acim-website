<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Designs | ACIM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">ACIM</div>
    <div class="sub">Admin dashboard</div>
    <a href="admin-dashboard.html">Overview</a>
    <a href="admin-users.html">Users</a>
    <a class="active" href="admin-gallery.html" aria-current="page">Designs</a>
    <a href="admin-feedback.html">Feedback</a>
  </nav>

  <main class="main">
    <div class="top">
      <h1>Designs</h1>
      <div class="who">
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch between light and dark mode">
          <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span id="who"></span>
        <button class="btn" data-logout>Log out</button>
      </div>
    </div>

    <div id="err"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search by design name, user or user ID" aria-label="Search designs">
      <select id="filter" aria-label="Filter by preview">
        <option value="all">All designs</option>
        <option value="yes">With preview</option>
        <option value="no">No preview</option>
      </select>
      <span id="count" class="count"></span>
    </div>

    <div class="gallery" id="grid"><p class="loading">Loading…</p></div>
    <div class="more" id="more"><button class="btn gold" id="moreBtn" type="button">Load more</button></div>
  </main>
</div>

<dialog id="viewer">
  <div class="dhead"><h2 id="vTitle">Design</h2><button class="btn" id="vClose" type="button">Close</button></div>
  <div class="dbody">
    <img id="zoom" class="zoom" alt="Saved design preview" hidden>
    <p id="vNote" class="empty" hidden></p>
    <dl id="vMeta" class="meta"></dl>
    <a id="download" class="btn gold" hidden>Download image</a>
  </div>
</dialog>

<script type="module" src="js/gallery.js"></script>
</body>
</html>
