<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard | ACIM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<script src="js/theme.js"></script>
<script src="js/expand.js" defer></script>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">ACIM</div>
    <div class="sub">Admin dashboard</div>
    <a class="active" href="admin-dashboard.html">Overview</a>
    <a href="admin-users.html">Users</a>
    <a href="admin-feedback.html">Feedback</a>
  </nav>

  <main class="main">
    <div class="top">
      <h1>Overview</h1>
      <div class="who">
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch between light and dark mode">
          <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span id="who"></span>
        <button class="btn" data-logout>Log out</button>
      </div>
    </div>

    <div id="errTotals"></div>
    <section class="stats">
      <div class="stat"><div class="k">Users</div><div class="v" id="sUsers">…</div></div>
      <div class="stat"><div class="k">Users who created a design</div><div class="v" id="sDesignUsers">…</div></div>
      <div class="stat"><div class="k">Feedback</div><div class="v" id="sFeedback">…</div></div>
      <div class="stat"><div class="k">Average rating</div><div class="v" id="sRating">…</div></div>
    </section>

    <section class="grid">
      <div class="card"><h2>Latest users</h2><div id="latestUsers" class="loading">Loading…</div></div>
      <div class="card"><h2>Latest feedback</h2><div id="latestFeedback" class="loading">Loading…</div></div>
    </section>
  </main>
</div>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
