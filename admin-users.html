<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Users | ACIM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<script src="js/theme.js"></script>
<script src="js/expand.js" defer></script>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">ACIM</div>
    <div class="sub">Admin dashboard</div>
    <a href="admin-dashboard.html">Overview</a>
    <a class="active" href="admin-users.html" aria-current="page">Users</a>
    <a href="admin-feedback.html">Feedback</a>
  </nav>

  <main class="main">
    <div class="top">
      <h1>Users</h1>
      <div class="who">
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch between light and dark mode">
          <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span id="who"></span>
        <button class="btn" data-logout>Log out</button>
      </div>
    </div>

    <div id="err"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search loaded users by name, email or ID" aria-label="Search users">
      <select id="filter" aria-label="Filter by design status">
        <option value="all">All users</option>
        <option value="yes">Created a design</option>
        <option value="no">No design yet</option>
      </select>
      <select id="fVerified" aria-label="Filter by email verification">
        <option value="all">All accounts</option>
        <option value="yes">Verified email</option>
        <option value="no">Not verified</option>
      </select>
      <button class="btn gold" id="addUserBtn" type="button">Add user</button>
      <span id="count" class="count"></span>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Created a design</th><th>Email status</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="more" id="more"><button class="btn gold" id="moreBtn">Load more</button></div>
  </main>
</div>

<dialog id="dialog">
  <div class="dhead"><h2 id="dTitle">User</h2><button class="btn" id="dClose">Close</button></div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script type="module" src="js/users.js"></script>
</body>
</html>
